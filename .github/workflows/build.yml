name: Build Android APK with Flet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet google-auth google-auth-oauthlib google-api-python-client requests

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Build APK with Flet
        run: |
          set -eux
          cd kukhen
          # show flet version and help for debug
          flet --version || true
          flet build --help || true
          # build APK (no --release flag: use default build behavior)
          flet build apk --org com.flet.kukhen

      - name: List build directory (for debugging)
        run: |
          echo "Contents of kukhen:" && ls -la kukhen || true
          echo "Contents of kukhen/build:" && ls -la kukhen/build || true
          echo "Find any apk files:" && find kukhen -type f -name "*.apk" -print || true

      - name: Upload any found APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kukhen-apk
          path: |
            kukhen/**/*.apk
            kukhen/build/**/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: kukhen/build/
          retention-days: 7
