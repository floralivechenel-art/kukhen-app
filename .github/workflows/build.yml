name: Build APK for Android

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Git first
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget unzip
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
    
    - name: Install Android SDK
      run: |
        # Установка Android SDK через commandlinetools
        mkdir -p ~/android-sdk/cmdline-tools
        cd ~/android-sdk/cmdline-tools
        
        # Скачиваем commandlinetools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mv cmdline-tools latest
        
        # Устанавливаем переменные окружения
        export ANDROID_HOME=~/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        
        # Создаем директорию licenses и принимаем лицензии
        mkdir -p ~/.android/licenses
        
        # Записываем хеши лицензий
        echo "24333f8a63b6825ea9c5514f83c9ca4d0e7acfe1" > ~/.android/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-google-play-services-license
        echo "d56f5187479451eabf01fb78af6dfcb131b33910e" > ~/.android/licenses/android-ndk-license
        echo "5be63a4997ce073d76597caf1b33f21e2c6affdc" > ~/.android/licenses/android-sdk-preview-license
        echo "8dab4689b93f02db8769f39a2c38d46352afaea5" > ~/.android/licenses/intel-android-sysimage-license
        echo "e4fd0d2c4145d3c6ad77f13852580bc0e108e6b91b0f3d1cb0e6a53b720e5e84" > ~/.android/licenses/google-android-sdk-license
        
        # Устанавливаем платформы и build-tools версии 37
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;37.0.0"
      env:
        ANDROID_HOME: ~/android-sdk
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
      env:
        ANDROID_HOME: ~/android-sdk
    
    - name: Install project dependencies
      run: |
        cd kukhen
        pip install -r requirements.txt
    
    - name: Build APK
      run: |
        cd kukhen
        buildozer android debug
      env:
        ANDROID_HOME: ~/android-sdk
        PATH: ~/android-sdk/cmdline-tools/latest/bin:~/android-sdk/platform-tools:/usr/bin:$PATH
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: kukhen-debug-apk
        path: kukhen/bin/*.apk
        retention-days: 30
    
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: kukhen/.buildozer/
        retention-days: 7
    
    - name: Notify on success
      if: success()
      run: echo "✅ APK успешно собран! Скачайте из Artifacts."
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ Сборка не удалась. Проверьте логи в Artifacts."
