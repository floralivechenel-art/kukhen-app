name: Build Android APK with Flet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet google-auth google-auth-oauthlib google-api-python-client requests

      - name: Build APK with Flet
        run: |
          cd kukhen
          flet build android --org com.flet.kukhen
        continue-on-error: true

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kukhen-apk
          path: |
            kukhen/build/outputs/apk/**/*.apk
            kukhen/build/outputs/**/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: kukhen/build/
          retention-days: 7
