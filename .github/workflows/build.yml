name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet google-auth google-api-python-client requests

      - name: Build APK
        run: |
          cd kukhen
          flet build apk --module-name main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KUKHEN-app
          path: kukhen/build/apk/*.apk
