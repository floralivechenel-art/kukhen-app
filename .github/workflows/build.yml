name: Build APK for Android

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Git first
      run: |
        sudo apt-get update
        sudo apt-get install -y git
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
    
    - name: Install Android SDK
      run: |
        sudo apt-get install -y android-sdk android-sdk-build-tools android-sdk-platform-tools
        
        # Создаем директорию лицензий
        mkdir -p ~/.android
        
        # Принимаем лицензии автоматически (без интерактивного диалога)
        echo -e "\n8939ba89b0942ffe6cce9003a0cee246339a3135c0" > ~/.android/android-sdk-license
        echo -e "\n24333f8a63b6825ea9c5514f83c9ca4d0e7acfe1" > ~/.android/android-sdk-preview-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910e" > ~/.android/android-ndk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/android-google-play-services-license
        
        export ANDROID_HOME=/usr/lib/android-sdk
      env:
        ANDROID_HOME: /usr/lib/android-sdk
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
      env:
        ANDROID_HOME: /usr/lib/android-sdk
    
    - name: Install project dependencies
      run: |
        cd kukhen
        pip install -r requirements.txt
    
    - name: Build APK
      run: |
        cd kukhen
        buildozer android debug
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        PATH: /usr/lib/android-sdk/cmdline-tools/latest/bin:/usr/lib/android-sdk/platform-tools:/usr/bin:$PATH
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: kukhen-debug-apk
        path: kukhen/bin/*.apk
        retention-days: 30
    
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: kukhen/.buildozer/
        retention-days: 7
    
    - name: Notify on success
      if: success()
      run: echo "✅ APK успешно собран! Скачайте из Artifacts."
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ Сборка не удалась. Проверьте логи в Artifacts."
