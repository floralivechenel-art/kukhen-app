name: Build APK for Android

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git android-sdk android-sdk-build-tools android-sdk-platform-tools
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Принимаем все лицензии Android SDK
        yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
        
        export ANDROID_HOME=/usr/lib/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
      env:
        ANDROID_HOME: /usr/lib/android-sdk
    
    - name: Install project dependencies
      run: |
        cd kukhen
        pip install -r requirements.txt
    
    - name: Build APK
      run: |
        cd kukhen
        buildozer android debug
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        PATH: /usr/lib/android-sdk/cmdline-tools/latest/bin:/usr/lib/android-sdk/platform-tools:$PATH
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: kukhen-debug-apk
        path: kukhen/bin/*.apk
        retention-days: 30
    
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: kukhen/.buildozer/
        retention-days: 7
    
    - name: Notify on success
      if: success()
      run: echo "✅ APK успешно собран! Скачайте из Artifacts."
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ Сборка не удалась. Проверьте логи в Artifacts."
